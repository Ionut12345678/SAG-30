name: SAG-30 free watchdog (read-only)
on:
  workflow_dispatch:
  schedule:
    # Diagnostic during US market activity; no dispatches or recovery writes.
    - cron: '7,22,37,52 8-23 * * 1-5'
    - cron: '7,22,37,52 0 * * 2-6'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watchdog unit tests
        run: python -m unittest discover -s tests -p 'test_free_watchdog.py' -v
      - name: Fetch persisted radar heartbeat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p watchdog-output
          if git fetch --depth=1 origin radar-state; then
            git show FETCH_HEAD:health.json > watchdog-output/health.json || true
          fi
      - name: Diagnose stored heartbeat only
        shell: bash
        run: |
          set -euo pipefail
          python -m radar.free_watchdog --health watchdog-output/health.json --output watchdog-output/diagnostic.json --fail-on-active-warning
          cat watchdog-output/diagnostic.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sag30-free-watchdog
          path: watchdog-output/diagnostic.json
          retention-days: 7
