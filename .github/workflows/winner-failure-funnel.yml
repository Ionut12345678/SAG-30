name: SAG-30 research winner failure funnel
on:
  workflow_dispatch:
  schedule:
    - cron: '55 23 * * 1-5'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test winner funnel
        run: python -m unittest discover -s tests -p 'test_winner_failure_funnel.py' -v
      - name: Read published historical winner report
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin radar-state
          git show FETCH_HEAD:winner_recall_report.json > winner-input.json
      - name: Classify winner misses without inventing missing evidence
        run: python -m radar.winner_failure_funnel --input winner-input.json --output winner-failure-funnel.json
      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sag30-winner-failure-funnel
          path: winner-failure-funnel.json
          if-no-files-found: ignore
          retention-days: 30
