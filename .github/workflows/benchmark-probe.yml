name: SAG30 benchmark probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/benchmark-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore checkpoint
        run: |
          git init /tmp/rs
          cd /tmp/rs
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin radar-state
          git checkout FETCH_HEAD
          gzip -dc radar.sqlite3.gz > /tmp/radar.sqlite3
      - name: Build probe report
        run: |
          mkdir -p reports
          python - <<'PY'
          import sqlite3,json
          db=sqlite3.connect('/tmp/radar.sqlite3')
          out={}
          tabs=[r[0] for r in db.execute("select name from sqlite_master where type='table' order by name")]
          for t in tabs:
              if any(x in t for x in ['observation','winner','scout','fast_path','candidate','milestone','shadow']):
                  cols=[r[1] for r in db.execute("pragma table_info("+t+")")]
                  n=db.execute("select count(*) from "+t).fetchone()[0]
                  out[t]={"rows":n,"cols":cols}
                  for col in ('retrieval_ts','source_ts','session','created_at','started'):
                      if col in cols:
                          try: out[t]["range_"+col]=db.execute(f"select min({col}),max({col}),count(distinct substr({col},1,10)) from {t}").fetchone()
                          except: pass
          open('reports/benchmark_probe.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Publish probe report
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add reports/benchmark_probe.json
          git commit -m "Publish benchmark probe" || exit 0
          git push
