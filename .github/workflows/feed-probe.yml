name: SAG-30 feed entitlement probe
# isolated entitlement check; no radar state writes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/feed-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Alpaca SIP entitlement
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: python
        run: |
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          url="https://data.alpaca.markets/v2/stocks/AAPL/snapshot?feed=sip"
          req=Request(url,headers={
              "APCA-API-KEY-ID":os.environ["ALPACA_API_KEY"],
              "APCA-API-SECRET-KEY":os.environ["ALPACA_SECRET_KEY"],
          })
          try:
              with urlopen(req,timeout=20) as r:
                  payload=json.loads(r.read())
              trade=payload.get("latestTrade") or {}
              print("SAG30_SIP_ENTITLEMENT=AVAILABLE")
              print("SAG30_SIP_HAS_TRADE="+str(bool(trade.get("t") and trade.get("p"))))
          except HTTPError as e:
              print("SAG30_SIP_ENTITLEMENT=UNAVAILABLE")
              print("SAG30_SIP_HTTP_STATUS="+str(e.code))
