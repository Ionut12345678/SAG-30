name: SAG-30 radar
on:
  schedule:
    # Covers 04:00-20:00 America/New_York across DST; runner remains authoritative.
    - cron: '*/5 8-23 * * 1-5'
    - cron: '*/5 0-1 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/radar-trigger'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sag30-state
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore durable state
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          if git ls-remote --exit-code --heads origin radar-state; then
            git fetch origin radar-state
            if git cat-file -e FETCH_HEAD:radar.sqlite3.gz 2>/dev/null; then
              git show FETCH_HEAD:radar.sqlite3.gz | gzip -dc > state/radar.sqlite3
            elif git cat-file -e FETCH_HEAD:radar.sqlite3 2>/dev/null; then
              # One-time migration path from the legacy uncompressed state.
              git show FETCH_HEAD:radar.sqlite3 > state/radar.sqlite3
            else
              echo "radar-state exists but contains no durable database"
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

      - name: Observe one prospective cycle
        id: scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set +e
          python -m radar.runner
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run v0.4 FAST-PATH SHADOW minute loop
        if: ${{ steps.scan.outputs.rc == '0' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          iterations="$(python -c "import json; c=json.load(open('config/radar.json')); print(int(c.get('fast_path_iterations',3)))")"
          sleep_seconds="$(python -c "import json; c=json.load(open('config/radar.json')); print(int(c.get('fast_path_sleep_seconds',55)))")"
          for i in $(seq 1 "$iterations"); do
            sleep "$sleep_seconds"
            python -m radar.fast_path_shadow \
              --db state/radar.sqlite3 \
              --config config/radar.json \
              --out state/fast_path_report.json
          done

      - name: Publish pending signal batch to ChatGPT bridge
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          BRANCH="chatgpt-signal-bridge"
          set +e
          EVENT_KEYS="$(python -m radar.bridge prepare --db state/radar.sqlite3 --out state/chatgpt_signal.json)"
          prep_rc=$?
          set -e
          if [ "$prep_rc" -eq 1 ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
            echo "pending=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$prep_rc" -ne 0 ]; then
            echo "rc=$prep_rc" >> "$GITHUB_OUTPUT"
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          (
            set -euo pipefail
            git fetch origin main
            if git ls-remote --exit-code --heads origin "$BRANCH"; then
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git rebase origin/main || { git rebase --abort; git reset --hard origin/main; }
            else
              git checkout -B "$BRANCH" origin/main
            fi
            mkdir -p alerts
            cp state/chatgpt_signal.json alerts/latest_signal.json
            if git diff --quiet -- alerts/latest_signal.json && git ls-files --error-unmatch alerts/latest_signal.json >/dev/null 2>&1; then
              published_commit="$(git rev-parse HEAD)"
              python -m radar.bridge ack --db state/radar.sqlite3 --payload state/chatgpt_signal.json --commit "$published_commit"
              exit 0
            fi
            git config user.name 'SAG-30 radar'
            git config user.email 'radar@users.noreply.github.com'
            git add alerts/latest_signal.json
            git commit -m "SAG-30 signal event $EVENT_KEYS"
            git push --force-with-lease origin HEAD:"$BRANCH"
            published_commit="$(git rev-parse HEAD)"
            python -m radar.bridge ack --db state/radar.sqlite3 --payload state/chatgpt_signal.json --commit "$published_commit"
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -z "$pr_number" ]; then
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                --title "SAG-30 live signal bridge" \
                --body "Automated prospective SAG-30 signal stream for ChatGPT Work. SHADOW / NOT BUY. Frozen v0.3.3 rules are not modified."
            fi
          )
          bridge_rc=$?
          set -e
          git checkout main >/dev/null 2>&1 || true
          echo "rc=$bridge_rc" >> "$GITHUB_OUTPUT"
          echo "pending=1" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build machine-readable heartbeat
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          python -m radar.health \
            --db state/radar.sqlite3 \
            --out state/health.json \
            --scan-rc "${{ steps.scan.outputs.rc || '1' }}" \
            --bridge-rc "${{ steps.bridge.outputs.rc || '1' }}"

      - name: Build semantic SHADOW calibration report
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          python -m radar.shadow_report \
            --db state/radar.sqlite3 \
            --out state/semantic_shadow_report.json

      - name: Build v0.3.4 candidate SHADOW report
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          python -m radar.candidate_v034_report \
            --db state/radar.sqlite3 \
            --out state/candidate_v034_report.json

      - name: Build winner recall audit
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          python -m radar.winner_recall_report \
            --db state/radar.sqlite3 \
            --out state/winner_recall_report.json

      - name: Build multi-engine SHADOW report
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          python -m radar.multi_engine_report \
            --db state/radar.sqlite3 \
            --out state/multi_engine_report.json

      - name: Persist audit state and heartbeat
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f state/radar.sqlite3 ]; then exit 1; fi
          mkdir -p /tmp/radar-state
          gzip -9 -c state/radar.sqlite3 > /tmp/radar-state/radar.sqlite3.gz
          compressed_bytes="$(stat -c%s /tmp/radar-state/radar.sqlite3.gz)"
          if [ "$compressed_bytes" -ge $((95 * 1024 * 1024)) ]; then
            echo "Compressed radar state is too large: ${compressed_bytes} bytes"
            exit 1
          fi
          cp state/health.json /tmp/radar-state/health.json
          cp state/semantic_shadow_report.json /tmp/radar-state/semantic_shadow_report.json
          cp state/candidate_v034_report.json /tmp/radar-state/candidate_v034_report.json
          cp state/winner_recall_report.json /tmp/radar-state/winner_recall_report.json
          cp state/multi_engine_report.json /tmp/radar-state/multi_engine_report.json
          if [ -f state/fast_path_report.json ]; then cp state/fast_path_report.json /tmp/radar-state/fast_path_report.json; fi
          cd /tmp/radar-state
          git init
          git config user.name 'SAG-30 radar'
          git config user.email 'radar@users.noreply.github.com'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.extraheader "$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          if git ls-remote --exit-code --heads origin radar-state; then
            git fetch origin radar-state
            git reset --soft FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          git rm --cached --ignore-unmatch radar.sqlite3 >/dev/null 2>&1 || true
          rm -f radar.sqlite3
          git add radar.sqlite3.gz health.json semantic_shadow_report.json candidate_v034_report.json winner_recall_report.json multi_engine_report.json
          if [ -f fast_path_report.json ]; then git add fast_path_report.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Append prospective radar audit and heartbeat'
          git push origin HEAD:radar-state

      - name: Enforce cycle result after persistence
        if: ${{ always() }}
        shell: bash
        run: |
          scan_rc="${{ steps.scan.outputs.rc || '1' }}"
          bridge_rc="${{ steps.bridge.outputs.rc || '1' }}"
          if [ "$scan_rc" -ne 0 ]; then
            echo "SAG30_SCAN_FAILED rc=$scan_rc"
            exit "$scan_rc"
          fi
          if [ "$bridge_rc" -ne 0 ]; then
            echo "SAG30_BRIDGE_FAILED rc=$bridge_rc"
            exit "$bridge_rc"
          fi
          echo "SAG30_CYCLE_PASS"
