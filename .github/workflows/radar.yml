name: SAG-30 radar
on:
  schedule:
    - cron: '7 * * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/radar-trigger'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sag30-state
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Restore durable state
        id: restore
        shell: bash
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin radar-state; then
            git fetch origin radar-state
            git show FETCH_HEAD:radar.sqlite3 > state/radar.sqlite3
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Diagnose latest DATA_QUALITY
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3, collections
          p='state/radar.sqlite3'
          db=sqlite3.connect(p)
          rows=db.execute("SELECT reason,COUNT(*) FROM observations WHERE run_id=(SELECT MAX(id) FROM runs) GROUP BY reason ORDER BY COUNT(*) DESC").fetchall()
          print('SAG30_DQ_SUMMARY', rows)
          samples=db.execute("SELECT symbol,source_ts,retrieval_ts,reason FROM observations WHERE run_id=(SELECT MAX(id) FROM runs) LIMIT 12").fetchall()
          for x in samples: print('SAG30_DQ_SAMPLE', x)
          db.close()
          PY
      - name: Observe and publish at controlled five-minute cadence
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          prepare_signal_batch() {
            python -m radar.bridge prepare --db state/radar.sqlite3 --out state/chatgpt_signal.json
          }


          push_signal_pr() {
            EVENT_ID="$1"
            BRANCH="chatgpt-signal-bridge"
            git fetch origin main
            if git ls-remote --exit-code --heads origin "$BRANCH"; then
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git rebase origin/main || { git rebase --abort; git reset --hard origin/main; }
            else
              git checkout -B "$BRANCH" origin/main
            fi
            mkdir -p alerts
            cp state/chatgpt_signal.json alerts/latest_signal.json
            if git diff --quiet -- alerts/latest_signal.json && git ls-files --error-unmatch alerts/latest_signal.json >/dev/null 2>&1; then
              PUBLISHED_COMMIT="$(git rev-parse HEAD)"
              python -m radar.bridge ack --db state/radar.sqlite3 --payload state/chatgpt_signal.json --commit "$PUBLISHED_COMMIT"
              git checkout main >/dev/null 2>&1 || true
              return 0
            fi
            git config user.name 'SAG-30 radar'
            git config user.email 'radar@users.noreply.github.com'
            git add alerts/latest_signal.json
            git commit -m "SAG-30 signal event $EVENT_ID"
            git push --force-with-lease origin HEAD:"$BRANCH"
            PUBLISHED_COMMIT="$(git rev-parse HEAD)"
            python -m radar.bridge ack --db state/radar.sqlite3 --payload state/chatgpt_signal.json --commit "$PUBLISHED_COMMIT"
            PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -z "$PR_NUMBER" ]; then
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                --title "SAG-30 live signal bridge" \
                --body "Automated prospective SAG-30 signal stream for ChatGPT Work. SHADOW / NOT BUY. Frozen v0.3.3 rules are not modified."
            fi
            git checkout main >/dev/null 2>&1 || true
          }

          for cycle in $(seq 1 12); do
            started=$(date -u +%s)
            echo "SAG30_CYCLE_START cycle=$cycle retrieval_wallclock=$(date -u --iso-8601=seconds)"
            python -m radar.runner || echo "SAG30_CYCLE_ERROR cycle=$cycle"
            EVENT_KEYS="$(prepare_signal_batch)" && push_signal_pr "$EVENT_KEYS" || true
            if [ "$cycle" -lt 12 ]; then
              elapsed=$(( $(date -u +%s) - started ))
              sleep_for=$(( 300 - elapsed ))
              if [ "$sleep_for" -gt 0 ]; then sleep "$sleep_for"; fi
            fi
          done
      - name: Persist audit state even after scan failure
        if: ${{ always() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          if [ ! -f state/radar.sqlite3 ]; then exit 0; fi
          mkdir -p /tmp/radar-state
          cp state/radar.sqlite3 /tmp/radar-state/radar.sqlite3
          cd /tmp/radar-state
          git init
          git config user.name 'SAG-30 radar'
          git config user.email 'radar@users.noreply.github.com'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.extraheader "$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          if git ls-remote --exit-code --heads origin radar-state; then
            git fetch origin radar-state
            git reset --soft FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          git add radar.sqlite3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Append prospective radar audit'
          git push origin HEAD:radar-state
