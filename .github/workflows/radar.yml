name: SAG-30 radar
on:
  schedule:
    # Watchdog only. Primary cadence self-chains through repository_dispatch.
    - cron: '12,42 4-19 * * 1-5'
      timezone: 'America/New_York'
  repository_dispatch:
    types: [sag30-cadence]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/radar-trigger'
permissions:
  contents: write
  actions: read
  pull-requests: write
concurrency:
  group: sag30-state
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore durable state
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state
          if git ls-remote --exit-code --heads origin radar-state; then
            git fetch --depth=1 origin radar-state
            state_commit="$(git rev-parse FETCH_HEAD)"
            echo "commit=$state_commit" >> "$GITHUB_OUTPUT"
            python -m radar.checkpoint restore --ref "$state_commit" --out state/radar.sqlite3
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            echo "commit=NONE" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore isolated SHADOW first-WATCH journal
        id: journals
        if: ${{ steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "${{ steps.restore.outputs.commit }}:health.json" 2>/dev/null; then
            git show "${{ steps.restore.outputs.commit }}:health.json" > state/previous-health.json
          fi
          for file in shadow_first_watch.jsonl shadow_watch_observations.jsonl; do
            if git cat-file -e "${{ steps.restore.outputs.commit }}:$file" 2>/dev/null; then
              git show "${{ steps.restore.outputs.commit }}:$file" > "state/$file"
            fi
          done

      - name: Recover unpublished prospective cycle before scanning
        id: recovery
        if: ${{ steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && steps.restore.outputs.commit != 'NONE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m radar.recovery --repo "$GITHUB_REPOSITORY" \
            --base-commit "${{ steps.restore.outputs.commit }}" \
            --base-published-ts "$(git show -s --format=%cI '${{ steps.restore.outputs.commit }}')" \
            --out state/radar.sqlite3 --status state/recovery-status.json --journal-dir state

      - name: Run v0.4.12 EARLY-PREMARKET ROUTING SHADOW
        if: ${{ always() && !cancelled() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          set +e
          python -m radar.v0412_premarket_router \
            --db state/radar.sqlite3 \
            --universe config/universe.csv \
            --out state/v0412_premarket_router_report.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          json.dump({
            "status":"DATA_GAP",
            "observed_ts":datetime.now(timezone.utc).isoformat(),
            "routes":[],
            "note":"v0.4.12 external routing unavailable; core SAG-30 continues; NOT BUY"
          },open("state/v0412_premarket_router_report.json","w"),indent=2)
          PY
          fi

      - name: Observe one prospective cycle
        if: ${{ always() && !cancelled() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        id: scan
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set +e
          python -m radar.runner
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run v0.4 FAST-PATH SHADOW minute loop
        id: fast_path
        if: ${{ steps.scan.outputs.rc == '0' }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          iterations="$(python -c "import json; c=json.load(open('config/radar.json')); print(int(c.get('fast_path_iterations',3)))")"
          sleep_seconds="$(python -c "import json; c=json.load(open('config/radar.json')); print(int(c.get('fast_path_sleep_seconds',55)))")"
          realtime_start="$(python -c "import json; c=json.load(open('config/radar.json')); print(int(c.get('fast_path_realtime_start_et_hour',0)))")"
          et_hour="$(TZ=America/New_York date +%H)"
          et_hour=$((10#$et_hour))
          if [ "$et_hour" -lt "$realtime_start" ]; then
            echo "SAG30_FAST_PATH_SKIPPED_PREMARKET_ROUTING_ONLY et_hour=$et_hour realtime_start=$realtime_start"
            echo "mode=PREMARKET_ROUTING_ONLY" >> "$GITHUB_OUTPUT"
            # Keep the v0.4.7 report interface current without fabricating new evidence.
            python -m radar.fast_path_v047_validated_overlay \
              --db state/radar.sqlite3 \
              --out state/fast_path_v047_validated_report.json
          else
            echo "mode=MINUTE_LOOP" >> "$GITHUB_OUTPUT"
            for i in $(seq 1 "$iterations"); do
              sleep "$sleep_seconds"
              python -m radar.fast_path_shadow \
                --db state/radar.sqlite3 \
                --config config/radar.json \
                --out state/fast_path_report.json
              python -m radar.fast_path_v047_validated_overlay \
                --db state/radar.sqlite3 \
                --out state/fast_path_v047_validated_report.json
            done
          fi

      - name: Run v0.4.9 ROLLING PRECURSOR SHADOW
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.v049_rolling_precursor \
            --db state/radar.sqlite3 \
            --out state/v049_rolling_precursor_report.json

      - name: Run v0.4.11 COHERENT-WINDOW PRECURSOR SHADOW
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.v0411_coherent_window \
            --db state/radar.sqlite3 \
            --out state/v0411_coherent_window_report.json

      - name: Run v0.4.8 CONVERSION CHALLENGER SHADOW
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.v048_conversion_challenger \
            --db state/radar.sqlite3 \
            --out state/v048_conversion_challenger_report.json

      - name: Capture immutable prospective SHADOW first WATCH and source observations
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          python -m radar.shadow_watch_capture --db state/radar.sqlite3 --state-dir state

      - name: Publish pending signal batch to ChatGPT bridge
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          BRANCH="chatgpt-signal-bridge"
          set +e
          EVENT_KEYS="$(python -m radar.bridge prepare --db state/radar.sqlite3 --out state/chatgpt_signal.json)"
          prep_rc=$?
          set -e
          if [ "$prep_rc" -eq 1 ]; then
            echo "rc=0" >> "$GITHUB_OUTPUT"
            echo "pending=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$prep_rc" -ne 0 ]; then
            echo "rc=$prep_rc" >> "$GITHUB_OUTPUT"
            echo "pending=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          (
            set -euo pipefail
            git fetch origin main
            if git ls-remote --exit-code --heads origin "$BRANCH"; then
              git fetch origin "$BRANCH"
              git checkout -B "$BRANCH" "origin/$BRANCH"
              git rebase origin/main || { git rebase --abort; git reset --hard origin/main; }
            else
              git checkout -B "$BRANCH" origin/main
            fi
            mkdir -p alerts
            cp state/chatgpt_signal.json alerts/latest_signal.json
            if git diff --quiet -- alerts/latest_signal.json && git ls-files --error-unmatch alerts/latest_signal.json >/dev/null 2>&1; then
              published_commit="$(git rev-parse HEAD)"
              python -m radar.bridge ack --db state/radar.sqlite3 --payload state/chatgpt_signal.json --commit "$published_commit"
              exit 0
            fi
            git config user.name 'SAG-30 radar'
            git config user.email 'radar@users.noreply.github.com'
            git add alerts/latest_signal.json
            git commit -m "SAG-30 signal event $EVENT_KEYS"
            git push --force-with-lease origin HEAD:"$BRANCH"
            published_commit="$(git rev-parse HEAD)"
            python -m radar.bridge ack --db state/radar.sqlite3 --payload state/chatgpt_signal.json --commit "$published_commit"
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
            if [ -z "$pr_number" ]; then
              gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
                --title "SAG-30 live signal bridge" \
                --body "Automated prospective SAG-30 signal stream for ChatGPT Work. SHADOW / NOT BUY. Frozen v0.3.3 rules are not modified."
            fi
          )
          bridge_rc=$?
          set -e
          git checkout main >/dev/null 2>&1 || true
          echo "rc=$bridge_rc" >> "$GITHUB_OUTPUT"
          echo "pending=1" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build machine-readable heartbeat
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.health \
            --db state/radar.sqlite3 \
            --out state/health.json \
            --scan-rc "${{ steps.scan.outputs.rc || '1' }}" \
            --bridge-rc "${{ steps.bridge.outputs.rc || '1' }}" \
            --fast-path-outcome "${{ steps.fast_path.outcome || 'skipped' }}" \
            --fast-path-mode "${{ steps.fast_path.outputs.mode || 'UNKNOWN' }}"

      - name: Build semantic SHADOW calibration report
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.shadow_report \
            --db state/radar.sqlite3 \
            --out state/semantic_shadow_report.json

      - name: Build v0.3.4 candidate SHADOW report
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.candidate_v034_report \
            --db state/radar.sqlite3 \
            --out state/candidate_v034_report.json

      - name: Build winner recall audit
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.winner_recall_report \
            --db state/radar.sqlite3 \
            --out state/winner_recall_report.json

      - name: Build multi-engine SHADOW report
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.multi_engine_report \
            --db state/radar.sqlite3 \
            --out state/multi_engine_report.json

      - name: Build real early PAPER quote report
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.early_paper_extra_report_v11 --db state/radar.sqlite3 --out state/early_paper_extra_report_v11.json

      - name: Build seven-day early PAPER outcomes
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.early_paper_outcome_report_v12 --db state/radar.sqlite3 --out state/early_paper_outcome_report_v12.json

      - name: Build PAPER quote-versus-momentum diagnostics
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.early_paper_diagnostic_v13 --db state/radar.sqlite3 --out state/early_paper_diagnostic_v13.json

      - name: Build matched momentum and turnover SHADOW audit
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.early_paper_momentum_shadow_v14 --db state/radar.sqlite3 --out state/early_paper_momentum_shadow_v14.json

      - name: Build PAPER matched forward outcomes
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        shell: bash
        run: |
          python -m radar.early_paper_matched_outcome_v15 --db state/radar.sqlite3 --out state/early_paper_matched_outcome_v15.json

      - name: Prepare lossless bounded checkpoint and size alerts
        id: checkpoint
        if: ${{ always() && steps.restore.outcome == 'success' && steps.journals.outcome == 'success' && (steps.restore.outputs.commit == 'NONE' || steps.recovery.outcome == 'success') }}
        run: |
          python -m radar.checkpoint prepare --db state/radar.sqlite3 \
            --out state/checkpoint --health state/health.json --journals state \
            --base-commit "${{ steps.restore.outputs.commit }}" --run-id "$GITHUB_RUN_ID"

      - name: Persist audit state and heartbeat
        id: persist
        if: ${{ always() && steps.checkpoint.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f state/radar.sqlite3 ]; then exit 1; fi
          mkdir -p /tmp/radar-state
          cp state/checkpoint/* /tmp/radar-state/
          compressed_bytes="$(python -c "import json; print(json.load(open('state/checkpoint/checkpoint.json'))['compressed_bytes'])")"
          cp state/health.json /tmp/radar-state/health.json
          for file in shadow_first_watch.jsonl shadow_watch_observations.jsonl shadow_watch_status.json; do
            if [ -f "state/$file" ]; then cp "state/$file" "/tmp/radar-state/$file"; fi
          done
          cp state/early_paper_extra_report_v11.json /tmp/radar-state/early_paper_extra_report_v11.json
          cp state/early_paper_outcome_report_v12.json /tmp/radar-state/early_paper_outcome_report_v12.json
          cp state/early_paper_diagnostic_v13.json /tmp/radar-state/early_paper_diagnostic_v13.json
          cp state/early_paper_momentum_shadow_v14.json /tmp/radar-state/early_paper_momentum_shadow_v14.json
          cp state/early_paper_matched_outcome_v15.json /tmp/radar-state/early_paper_matched_outcome_v15.json
          cp state/semantic_shadow_report.json /tmp/radar-state/semantic_shadow_report.json
          cp state/candidate_v034_report.json /tmp/radar-state/candidate_v034_report.json
          cp state/winner_recall_report.json /tmp/radar-state/winner_recall_report.json
          cp state/multi_engine_report.json /tmp/radar-state/multi_engine_report.json
          if [ -f state/fast_path_report.json ]; then cp state/fast_path_report.json /tmp/radar-state/fast_path_report.json; fi
          if [ -f state/fast_path_v047_validated_report.json ]; then cp state/fast_path_v047_validated_report.json /tmp/radar-state/fast_path_v047_validated_report.json; fi
          if [ -f state/v048_conversion_challenger_report.json ]; then cp state/v048_conversion_challenger_report.json /tmp/radar-state/v048_conversion_challenger_report.json; fi
          if [ -f state/v049_rolling_precursor_report.json ]; then cp state/v049_rolling_precursor_report.json /tmp/radar-state/v049_rolling_precursor_report.json; fi
          if [ -f state/v0411_coherent_window_report.json ]; then cp state/v0411_coherent_window_report.json /tmp/radar-state/v0411_coherent_window_report.json; fi
          if [ -f state/v0412_premarket_router_report.json ]; then cp state/v0412_premarket_router_report.json /tmp/radar-state/v0412_premarket_router_report.json; fi
          cd /tmp/radar-state
          # radar-state is a mutable checkpoint, not an audit-history branch. Recreate it
          # as a one-commit snapshot so 5-minute cycles never download an ever-growing
          # chain of large compressed SQLite blobs. Signal/audit history remains in SQLite.
          git init
          git config user.name 'SAG-30 radar'
          git config user.email 'radar@users.noreply.github.com'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git config http.extraheader "$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)"
          git add checkpoint.json radar.sqlite3.gz.part-* health.json semantic_shadow_report.json candidate_v034_report.json winner_recall_report.json multi_engine_report.json
          for file in shadow_first_watch.jsonl shadow_watch_observations.jsonl shadow_watch_status.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git add early_paper_extra_report_v11.json early_paper_outcome_report_v12.json early_paper_diagnostic_v13.json early_paper_momentum_shadow_v14.json early_paper_matched_outcome_v15.json
          if [ -f fast_path_report.json ]; then git add fast_path_report.json; fi
          if [ -f fast_path_v047_validated_report.json ]; then git add fast_path_v047_validated_report.json; fi
          if [ -f v048_conversion_challenger_report.json ]; then git add v048_conversion_challenger_report.json; fi
          if [ -f v049_rolling_precursor_report.json ]; then git add v049_rolling_precursor_report.json; fi
          if [ -f v0411_coherent_window_report.json ]; then git add v0411_coherent_window_report.json; fi
          if [ -f v0412_premarket_router_report.json ]; then git add v0412_premarket_router_report.json; fi
          git commit -m 'Refresh prospective radar checkpoint'
          # GitHub occasionally returns a transient 5xx while accepting a large checkpoint
          # ref update. Retry the same immutable snapshot; do not rescan or alter history.
          pushed=0
          for attempt in 1 2 3 4; do
            echo "SAG30_CHECKPOINT_PUSH_ATTEMPT=$attempt bytes=$compressed_bytes"
            expected="${{ steps.restore.outputs.commit }}"
            if [ "$expected" = NONE ]; then expected=""; fi
            remote_commit="$(git ls-remote origin refs/heads/radar-state | cut -f1)"
            if [ "$remote_commit" = "$(git rev-parse HEAD)" ]; then
              pushed=1
              break
            fi
            if git push --force-with-lease="radar-state:$expected" origin HEAD:radar-state; then
              pushed=1
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            echo "SAG30_CHECKPOINT_PUSH_FAILED_AFTER_RETRIES"
            exit 1
          fi
          published_commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote origin refs/heads/radar-state | cut -f1)"
          if [ "$remote_commit" != "$published_commit" ]; then
            echo "SAG30_CHECKPOINT_PUBLICATION_NOT_CONFIRMED"
            exit 1
          fi
          echo "SAG30_CHECKPOINT_PUSH_PASS bytes=$compressed_bytes commit=$published_commit"
          echo "Checkpoint publication confirmed: $published_commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve unpublished audit checkpoint for automatic recovery
        if: ${{ always() && steps.checkpoint.outcome == 'success' && steps.persist.outcome != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sag30-checkpoint-recovery
          path: state/checkpoint/
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Preserve forensic database if checkpoint preparation failed
        if: ${{ always() && steps.checkpoint.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: sag30-checkpoint-forensic
          path: |
            state/radar.sqlite3*
            state/health.json
            state/shadow_*.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Dispatch next cadence cycle
        if: ${{ always() && steps.persist.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          should_chain="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('America/New_York'))
          print('1' if now.weekday() < 5 and 4 <= now.hour < 20 else '0')
          PY
          )"
          if [ "$should_chain" != "1" ]; then
            echo "Outside U.S. observation window; cadence chain stops."
            exit 0
          fi
          wait_seconds="$(python - <<'PY'
          import json, sqlite3
          from datetime import datetime, timezone
          from radar.cadence import dispatch_wait
          target=int(json.load(open('config/radar.json')).get('cadence_target_seconds',300))
          db=sqlite3.connect('state/radar.sqlite3')
          rows=db.execute('SELECT started FROM runs ORDER BY id DESC LIMIT 2').fetchall()
          db.close()
          prior=json.load(open('state/previous-health.json')) if __import__('pathlib').Path('state/previous-health.json').exists() else {}
          compensation=prior.get('cadence',{}).get('dispatch_compensation_seconds',0)
          plan=dispatch_wait([r[0] for r in rows], datetime.now(timezone.utc), target, compensation)
          print(plan['wait_seconds'])
          print('SAG30_CADENCE_PLAN=' + json.dumps(plan), file=__import__('sys').stderr)
          PY
          )"
          if [ "$wait_seconds" -gt 0 ]; then
            echo "SAG30_CADENCE_WAIT_SECONDS=$wait_seconds"
            sleep "$wait_seconds"
          fi
          dispatched=0
          for attempt in 1 2 3; do
            echo "SAG30_DISPATCH_ATTEMPT=$attempt"
            if gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type='sag30-cadence'; then
              dispatched=1
              break
            fi
            sleep $((attempt * 3))
          done
          if [ "$dispatched" -ne 1 ]; then
            echo "SAG30_NEXT_CYCLE_DISPATCH_FAILED"
            exit 1
          fi
          echo "SAG30_NEXT_CYCLE_DISPATCHED"

      - name: Enforce cycle result after persistence
        if: ${{ always() }}
        shell: bash
        run: |
          persist_outcome="${{ steps.persist.outcome || 'skipped' }}"
          fast_path_outcome="${{ steps.fast_path.outcome || 'skipped' }}"
          if [ "$persist_outcome" != success ]; then
            echo "SAG30_CYCLE_FAIL_CHECKPOINT_NOT_PUBLISHED outcome=$persist_outcome"
            exit 1
          fi
          if [ "$fast_path_outcome" = failure ] || [ "$fast_path_outcome" = cancelled ]; then
            echo "SAG30_CYCLE_FAIL_FAST_PATH outcome=$fast_path_outcome"
            exit 1
          fi
          scan_rc="${{ steps.scan.outputs.rc || '1' }}"
          bridge_rc="${{ steps.bridge.outputs.rc || '1' }}"
          if [ "$scan_rc" -ne 0 ]; then
            echo "SAG30_SCAN_FAILED rc=$scan_rc"
            exit "$scan_rc"
          fi
          if [ "$bridge_rc" -ne 0 ]; then
            echo "SAG30_BRIDGE_FAILED rc=$bridge_rc"
            exit "$bridge_rc"
          fi
          echo "SAG30_CYCLE_PASS"
