name: SAG-30 forward WATCH outcomes (SHADOW)
on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 1-5"
permissions:
  contents: read
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify outcome logic
        run: python -m unittest discover -s tests -p 'test_forward_watch_outcomes.py' -v
      - name: Fetch immutable WATCH journal and observation history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p watch-audit
          git fetch --depth=1 origin radar-state
          git show FETCH_HEAD:shadow_first_watch.jsonl > watch-audit/shadow_first_watch.jsonl
          git show FETCH_HEAD:shadow_watch_observations.jsonl > watch-audit/shadow_watch_observations.jsonl
      - name: Calculate observed post-WATCH outcomes
        run: python -m radar.forward_watch_outcomes --state-dir watch-audit --out watch-audit/forward_watch_outcomes.json
      - name: Attach forward audit (never writes radar-state)
        uses: actions/upload-artifact@v4
        with:
          name: sag30-forward-watch-outcomes
          path: watch-audit/forward_watch_outcomes.json
          retention-days: 30
