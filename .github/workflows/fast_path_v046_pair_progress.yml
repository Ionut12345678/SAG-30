name: SAG-30 v0.4.6 FLOW pair-progress
on:
  push:
    branches: [main]
    paths:
      - 'research/fast_path_v046_pair_progress.py'
      - 'rules/SAG-30-v0.4.6-FLOW-PAIR-PROGRESS-SHADOW.txt'
      - '.github/workflows/fast_path_v046_pair_progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore immutable date-matched dataset
        uses: actions/cache/restore@v4
        with:
          path: research/cache/sag30_date_matched_v045_dataset.json.gz
          key: sag30-date-matched-v045-cache-2
          fail-on-cache-miss: true
      - name: Compile
        run: python -m py_compile research/fast_path_v041_replay.py research/fast_path_v046_pair_progress.py
      - name: Run pre-registered DEV/HOLDOUT study
        run: python -m research.fast_path_v046_pair_progress
      - uses: actions/upload-artifact@v4
        with:
          name: sag30-v046-flow-pair-progress
          path: research/fast_path_v046_pair_progress.json
          retention-days: 30
