name: SAG-30 matched baseline research
on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * 2-6'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_matched_baseline.py' -v
      - name: Restore existing immutable observations (read-only)
        run: |
          git fetch --depth=1 origin radar-state
          python -m radar.checkpoint restore --ref FETCH_HEAD --out /tmp/sag30-baseline.sqlite3
      - name: Compare same-cohort rules
        run: python -m radar.matched_baseline --db /tmp/sag30-baseline.sqlite3 --output baseline-comparison.json
      - name: Retain audit only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sag30-matched-baseline
          path: baseline-comparison.json
          if-no-files-found: ignore
          retention-days: 30
