name: SAG-30 frozen replay dataset
on:
  push:
    branches: [main]
    paths:
      - 'research/build_frozen_replay_dataset.py'
      - '.github/workflows/build_frozen_replay_dataset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile research/build_frozen_replay_dataset.py
      - name: Build immutable dataset
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.build_frozen_replay_dataset
      - name: Save immutable cache
        uses: actions/cache/save@v4
        with:
          path: research/cache/sag30_date_matched_v045_dataset.json.gz
          key: sag30-date-matched-v045-cache-1
      - uses: actions/upload-artifact@v4
        with:
          name: sag30-date-matched-v045-frozen-dataset
          path: |
            research/cache/sag30_date_matched_v045_dataset.json.gz
            research/cache/sag30_date_matched_v045_dataset.json.gz.manifest.json
          retention-days: 30
