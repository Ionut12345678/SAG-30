name: SAG30 v048 replay benchmark
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v048-replay-benchmark.yml']
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --depth=1 origin radar-state
          python -m radar.checkpoint restore --ref FETCH_HEAD --out /tmp/radar.sqlite3
      - run: mkdir -p reports && python radar/v048_replay_benchmark.py
      - run: |
          cp reports/v048_replay_benchmark.json /tmp/v048_replay_benchmark.json
          git config user.name github-actions
          git config user.email actions@github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p reports
          cp /tmp/v048_replay_benchmark.json reports/v048_replay_benchmark.json
          git add reports/v048_replay_benchmark.json
          git commit -m "Publish v0.4.8 replay benchmark" || exit 0
          git push

