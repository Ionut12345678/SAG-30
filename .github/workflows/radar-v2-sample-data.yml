name: Radar v2 sample market data
on:
  pull_request:
    paths:
      - 'research/radar_v2/**'
      - '.github/workflows/radar-v2-sample-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public research sample
        run: |
          for symbol in AAPL MSFT NVDA AMD PLTR; do
            python research/radar_v2/public_data_adapter.py --symbol "$symbol" --interval 1d --range 1y --output "research/radar_v2/data/${symbol}_daily.jsonl"
          done
          python -c "import json,pathlib; paths=list(pathlib.Path('research/radar_v2/data').glob('*_daily.jsonl')); assert len(paths)==5; rows=[json.loads(x) for p in paths for x in p.read_text().splitlines()]; assert len(rows)>=500, 'Insufficient sample'; assert all(r['close']>0 and r['source_ts'] and r['volume'] is not None for r in rows); print('VALIDATED_ROWS',len(rows),'SYMBOLS',len(paths))"
      - name: Audit historical daily outcomes
        run: python research/radar_v2/daily_outcome_audit.py --input-dir research/radar_v2/data --output research/radar_v2/data/outcome-audit.json
            research/radar_v2/data/momentum-baseline.json
      - name: Run exploratory momentum baseline
        run: python research/radar_v2/daily_baseline.py --input-dir research/radar_v2/data --output research/radar_v2/data/momentum-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: radar-v2-public-sample
          path: |
            research/radar_v2/data/*_daily.jsonl
            research/radar_v2/data/outcome-audit.json
          retention-days: 7
