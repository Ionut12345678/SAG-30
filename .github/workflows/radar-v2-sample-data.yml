name: Radar v2 sample market data
on:
  pull_request:
    paths:
      - 'research/radar_v2/**'
      - '.github/workflows/radar-v2-sample-data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public research sample
        run: |
          python research/radar_v2/public_data_adapter.py --symbol AAPL --interval 1d --range 1mo --output research/radar_v2/data/aapl_daily.jsonl
          python -c "import json,pathlib; p=pathlib.Path('research/radar_v2/data/aapl_daily.jsonl'); rows=[json.loads(x) for x in p.read_text().splitlines()]; assert len(rows)>=5, 'Insufficient sample'; assert all(r['close']>0 and r['source_ts'] and r['volume'] is not None for r in rows); print('VALIDATED_ROWS',len(rows))"
      - uses: actions/upload-artifact@v4
        with:
          name: radar-v2-public-sample
          path: research/radar_v2/data/aapl_daily.jsonl
          retention-days: 7
