name: SAG30 compression probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compression-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git init /tmp/rs; cd /tmp/rs
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch --depth=1 origin radar-state && git checkout FETCH_HEAD
          gzip -dc radar.sqlite3.gz > /tmp/r.db
      - run: |
          mkdir -p reports
          python - <<'PY'
          import sqlite3,json
          db=sqlite3.connect('/tmp/r.db');o={}
          for s in ['MTEN','NXAT']:
            o[s]={'fast':[],'scout':[]}
            rr=db.execute("""select retrieval_ts,change_pct,bar_high_pct,observed_volume,spread_pct,acceleration,impulse,state from fast_path_events where session='2026-10-07' and symbol=? order by retrieval_ts,id""",(s,)).fetchall()
            o[s]['fast']=[dict(zip(['ts','pct','high','vol','spread','accel','impulse','state'],x)) for x in rr]
            rr=db.execute("""select retrieval_ts,change_pct,acceleration_pp_per_min,fresh_turnover_impulse_per_min,turnover,rank_change,rank_acceleration,rank_impulse,rank_turnover,selected,sticky from scout_history where session='2026-10-07' and symbol=? order by retrieval_ts""",(s,)).fetchall()
            o[s]['scout']=[dict(zip(['ts','pct','accel','turnover_impulse','turnover','rank_change','rank_accel','rank_impulse','rank_turnover','selected','sticky'],x)) for x in rr]
          open('reports/compression_probe.json','w').write(json.dumps(o,indent=2))
          PY
      - run: |
          cp reports/compression_probe.json /tmp/r.json
          git config user.name github-actions; git config user.email actions@github.com
          git fetch origin main && git reset --hard origin/main
          mkdir -p reports; cp /tmp/r.json reports/compression_probe.json
          git add reports/compression_probe.json
          git commit -m "Publish compression precursor probe" || exit 0
          git push
