name: SHADOW Lite schedule recovery watchdog
on:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: sag30-shadow-lite-watchdog
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover only if no recent SHADOW Lite run during US market hours
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m radar.shadow_schedule_watchdog
