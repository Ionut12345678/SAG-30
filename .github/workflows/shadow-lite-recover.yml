name: SHADOW Lite read-only post-alert recovery
on:
  schedule:
    - cron: '23 3 * * 2-6' # 03:23 UTC Tue-Sat: after US evening, best effort
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve persisted SHADOW Lite state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shadow-recovery
          gh api "repos/$GITHUB_REPOSITORY/contents/shadow_lite/state.json?ref=shadow-lite-state" --jq .content | base64 -d > shadow-recovery/state.json
      - name: Recover minute bars after alerts (IEX, read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m radar.shadow_recover --state shadow-recovery/state.json --out shadow-recovery/outcomes.json
      - name: Upload recovery evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-lite-intraday-recovery
          path: shadow-recovery/outcomes.json
          if-no-files-found: warn
          retention-days: 30
