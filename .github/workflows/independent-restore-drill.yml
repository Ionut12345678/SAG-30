name: SAG-30 independent restore drill (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * 2-6'
permissions:
  contents: read
jobs:
  verify-published-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run non-destructive restore regression tests
        run: python -m unittest discover -s tests -p 'test_remote_restore_drill.py' -v
      - name: Fetch published remote state
        run: git fetch --depth=1 origin radar-state
      - name: Verify restored SQLite and hashed WATCH journals
        shell: bash
        run: |
          set -euo pipefail
          python -m radar.remote_restore_drill --ref FETCH_HEAD --output restore-report.json
          cat restore-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload result only, not sensitive checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sag30-independent-restore-drill
          path: restore-report.json
          if-no-files-found: ignore
          retention-days: 14
