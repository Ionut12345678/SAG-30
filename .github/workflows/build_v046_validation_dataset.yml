name: SAG-30 pre-v046 validation dataset
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_v046_validation_dataset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile research/build_frozen_replay_dataset.py
      - name: Build independent pre-development dataset
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m research.build_frozen_replay_dataset --end 2026-09-18T00:00:00+00:00 --out research/cache/sag30_v046_validation_dataset.json.gz
      - uses: actions/cache/save@v4
        with:
          path: research/cache/sag30_v046_validation_dataset.json.gz
          key: sag30-v046-validation-pre-20260918-1
      - uses: actions/upload-artifact@v4
        with:
          name: sag30-v046-validation-dataset
          path: |
            research/cache/sag30_v046_validation_dataset.json.gz
            research/cache/sag30_v046_validation_dataset.json.gz.manifest.json
          retention-days: 30
