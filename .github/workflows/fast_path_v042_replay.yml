name: SAG-30 v0.4.2 event-time replay
on:
  push:
    branches: [main]
    paths:
      - 'research/fast_path_v042_replay.py'
      - 'rules/SAG-30-v0.4.2-EVENT-TIME-SHADOW.txt'
      - '.github/workflows/fast_path_v042_replay.yml'
  pull_request:
    paths:
      - 'research/fast_path_v042_replay.py'
      - 'rules/SAG-30-v0.4.2-EVENT-TIME-SHADOW.txt'
      - '.github/workflows/fast_path_v042_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile
        run: python -m py_compile research/fast_path_v041_replay.py research/fast_path_v042_replay.py
      - name: Run v0.4.2 balanced replay
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python research/fast_path_v042_replay.py --winners 300 --nonwinners 300 --lookback-days 240 --feed iex --workers 6 --out research/fast_path_v042_replay.json
      - uses: actions/upload-artifact@v4
        with:
          name: sag30-v042-event-time-replay
          path: research/fast_path_v042_replay.json
          retention-days: 30
