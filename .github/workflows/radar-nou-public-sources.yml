name: Radar Nou automatic stock discovery (SHADOW)
on:
  schedule:
    # Off-peak slots: avoid :00 congestion. Best-effort UTC, not exact timing.
    - cron: '17,47 13-21 * * 1-5'
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-nou-public-sources.yml'
      - 'radar_discovery.py'
      - 'radar_followup.py'
      - 'radar_quality_audit.py'
      - 'radar_cross_source.py'
      - 'radar-pulses/**'
  workflow_run:
    workflows: ["Radar Nou schedule heartbeat"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-nou-source-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  public-source-read-only:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover previous screening state (isolated by PR or production)
        uses: actions/cache/restore@v4
        with:
          path: |
            candidate-state.json
            vendor-quote-state.json
            twelve-data-quote-state.json
          key: ${{ github.event_name == 'pull_request' && format('radar-nou-history-pr-{0}', github.event.pull_request.number) || 'radar-nou-candidate-history' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.event_name == 'pull_request' && format('radar-nou-history-pr-{0}', github.event.pull_request.number) || 'radar-nou-candidate-history' }}-
      - name: Record trigger and actual UTC runtime
        run: |
          echo "trigger=${{ github.event_name }} started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "upstream_heartbeat_id=${{ github.event.workflow_run.id || 'none' }}"

      - name: Audit persisted state readback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("candidate-state.json")
          if not p.exists():
              print("STATE_READBACK=NO_PREVIOUS_STATE")
          else:
              state = json.loads(p.read_text())
              sessions = state.get("sessions", {})
              counts = {k: len(v) for k, v in sessions.items() if isinstance(v, dict)}
              print("STATE_READBACK=RESTORED")
              print("RESTORED_SESSION_SYMBOL_COUNTS=" + json.dumps(counts, sort_keys=True))
          PY
      - name: Diagnose feed quality
        run: python probe_public_sources.py --out source-evidence.json
      - name: Search listed stocks for early +5..+10 percent candidates
        run: python radar_discovery.py --output radar-discovery.json --snapshot nasdaq-snapshot.json
      - name: Check timestamp and price against independent public chart source
        run: python radar_cross_source.py --discovery radar-discovery.json --out cross-source-timing.json
      - name: Track vendor-timestamped price outcomes (read-only)
        run: python radar_vendor_quotes.py --state vendor-quote-state.json --feed cross-source-timing.json --out vendor-quote-followup.json
      - name: Fetch 1-minute Twelve Data quotes when API key is connected
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python radar_twelvedata.py --discovery radar-discovery.json --state twelve-data-quote-state.json --out twelve-data-quotes.json
      - name: Track Twelve Data timestamped outcomes
        run: python radar_vendor_quotes.py --state twelve-data-quote-state.json --feed twelve-data-quotes.json --out twelve-data-followup.json
      - name: Track candidate outcomes vs later screen snapshots
        run: python radar_followup.py --state candidate-state.json --out candidate-followup.json --snapshot nasdaq-snapshot.json
      - name: Audit quality and follow-up coverage
        run: python radar_quality_audit.py --out radar-quality.json
      - name: Persist screening state for next scheduled run
        if: hashFiles('candidate-state.json', 'vendor-quote-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            candidate-state.json
            vendor-quote-state.json
            twelve-data-quote-state.json
          key: ${{ github.event_name == 'pull_request' && format('radar-nou-history-pr-{0}', github.event.pull_request.number) || 'radar-nou-candidate-history' }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload evidence even if no data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-nou-tracked-discovery-evidence
          path: |
            source-evidence.json
            radar-discovery.json
            nasdaq-snapshot.json
            candidate-followup.json
            radar-quality.json
            cross-source-timing.json
            candidate-state.json
            vendor-quote-state.json
            twelve-data-quote-state.json
            vendor-quote-followup.json
            twelve-data-quotes.json
            twelve-data-followup.json
          if-no-files-found: warn
