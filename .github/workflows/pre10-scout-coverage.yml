name: SAG-30 pre10 scout coverage audit (research only)
on:
  workflow_dispatch:
  schedule:
    - cron: '35 1 * * 2-6'
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic coverage cases
        run: python -m unittest discover -s tests -p 'test_pre10_scout_coverage.py' -v
      - name: Restore published checkpoint without modification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin radar-state
          python -m radar.checkpoint restore --ref FETCH_HEAD --out /tmp/sag30-research.sqlite3
          git show FETCH_HEAD:winner_recall_report.json > /tmp/sag30-winner-report.json
      - name: Diagnose missing early scout observations
        run: |
          python -m radar.pre10_scout_coverage --db /tmp/sag30-research.sqlite3 --winners /tmp/sag30-winner-report.json --output scout-coverage-audit.json
      - name: Publish diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sag30-pre10-coverage-research
          path: scout-coverage-audit.json
          if-no-files-found: ignore
          retention-days: 30
