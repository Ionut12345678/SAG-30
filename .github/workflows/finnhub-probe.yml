name: SAG-30 Finnhub challenger probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finnhub-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe optional Finnhub challenger
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        shell: python
        run: |
          import json, os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          key=os.getenv("FINNHUB_API_KEY","").strip()
          if not key:
              print("SAG30_FINNHUB_SECRET=MISSING")
              raise SystemExit(0)
          print("SAG30_FINNHUB_SECRET=CONFIGURED")
          req=Request("https://finnhub.io/api/v1/quote?symbol=AAPL",headers={"X-Finnhub-Token":key})
          try:
              with urlopen(req,timeout=20) as r:
                  p=json.loads(r.read())
              ok=bool(p.get("c") and p.get("t"))
              print("SAG30_FINNHUB_QUOTE="+("AVAILABLE" if ok else "NO_CURRENT_TRADE"))
          except HTTPError as e:
              print("SAG30_FINNHUB_QUOTE=HTTP_"+str(e.code))
